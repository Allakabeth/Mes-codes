<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes codes</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes codes">
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1b1f27; --muted:#5a6272;
    --main:#1f4e8c; --ok:#1e8a3c; --danger:#c0392b; --line:#d9deea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:20px;line-height:1.4;padding-bottom:env(safe-area-inset-bottom)}
  header{background:var(--main);color:#fff;padding:10px 16px;min-height:56px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:24px;flex:1}
  header button{background:rgba(255,255,255,.18);color:#fff;border:0;
    border-radius:12px;font-size:20px;padding:10px 14px}
  main{padding:12px 16px;max-width:560px;margin:0 auto}
  .hidden{display:none!important}
  button{font:inherit;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .site{border:0;border-radius:18px;padding:18px 10px;min-height:120px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;color:#fff;font-weight:700;font-size:19px;text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .site .ico{font-size:42px;line-height:1}
  .big{display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:0;border-radius:16px;padding:18px;font-size:22px;
    font-weight:700;margin-top:14px;min-height:64px}
  .b-main{background:var(--main);color:#fff}
  .b-light{background:#fff;color:var(--main);border:3px solid var(--main)}
  .b-ok{background:var(--ok);color:#fff}
  .b-danger{background:#fff;color:var(--danger);border:3px solid var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:6px 10px}
  .empty .ico{font-size:44px}
  .empty p{margin:4px 0}
  .box{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;
    border:2px solid var(--line)}
  .step{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted);font-size:17px}
  .num{background:var(--main);color:#fff;border-radius:50%;width:30px;height:30px;
    display:inline-flex;align-items:center;justify-content:center;flex:none}
  .value{font-size:24px;font-weight:700;margin:10px 0 4px;word-break:break-all;
    font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
  .row{display:flex;gap:10px}
  .row .big{margin-top:10px}
  .eye{flex:0 0 76px}
  .title{display:flex;align-items:center;gap:12px;border-radius:16px;
    padding:8px 14px;color:#fff}
  .title .ico{font-size:34px}
  .title h2{margin:0;font-size:23px}
  .help{background:#fff8e1;border:2px solid #f1c232;border-radius:16px;
    padding:14px;margin-top:14px;font-size:19px}
  label{display:block;font-weight:700;margin:12px 0 4px}
  input{width:100%;font:inherit;font-size:21px;padding:11px 12px;border-radius:14px;
    border:3px solid var(--line);background:#fff}
  input:focus{outline:none;border-color:var(--main)}
  .speak{background:none;border:0;font-size:26px;padding:4px 8px;margin-left:auto}
  .back{background:none;border:0;color:var(--main);font-size:20px;font-weight:700;
    padding:6px 0;display:flex;align-items:center;gap:6px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--ok);color:#fff;padding:16px 26px;border-radius:40px;
    font-size:22px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:20}
  .small{font-size:17px;color:var(--muted);text-align:center;margin-top:22px}
  .center{text-align:center}
  .muted{color:var(--muted);font-size:18px;margin:8px 0}
  .lockico{font-size:54px;text-align:center;margin-top:0;line-height:1.2}
  .pwrow{align-items:stretch}
  .pwrow input{flex:1;min-width:0}
  .pwrow .eye{margin-top:0;min-height:0}
  .oneline{white-space:nowrap;font-size:clamp(15px,4.6vw,21px);padding-left:8px;padding-right:8px}
  .compact label{margin:14px 0 6px}
  #presets{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  #presets .site{min-height:0;height:max(80px,calc((100dvh - 170px) / 4));max-height:150px;
    padding:8px 4px;font-size:clamp(13px,3.8vw,15px);gap:4px;border-radius:14px;overflow-wrap:anywhere}
  #presets .site .ico{font-size:32px}
  #vSite .box{padding:10px 12px;margin-top:10px}
  .vrow{display:flex;align-items:center;gap:10px;margin-top:8px}
  .vrow .value{flex:1;min-width:0;margin:0;font-size:19px;font-family:inherit;letter-spacing:0;overflow-wrap:anywhere;line-height:1.25}
  .vrow .big{margin-top:0;min-height:52px;padding:8px 14px;font-size:20px}
  .copybtn{flex:0 0 auto;width:auto}
  .vrow .eye{flex:0 0 56px;padding:0}
  .smallrow{margin-top:12px}
  .smallbtn{flex:1;border-radius:12px;padding:10px;font-size:17px;font-weight:700;min-height:46px}
  #vForm .title + #customFields label:first-child, .nofirstmargin label:first-child{margin-top:4px}
  .err{color:var(--danger);font-weight:700;margin-top:8px}
  .linkbtn{display:block;margin:22px auto 0;background:none;border:0;color:var(--muted);
    text-decoration:underline;font-size:18px;padding:10px}
</style>
</head>
<body>

<header>
  <button id="hdrBack" class="hidden" aria-label="Retour">◀</button>
  <h1 id="hdrTitle">Mes codes</h1>
  <button id="btnLockNow" class="hidden" aria-label="Changer mon mot de passe">🔒</button>
</header>

<main>

  <!-- ÉCRAN VERROU -->
  <section id="vLock" class="hidden">
    <div class="lockico">🔒</div>
    <p class="small" style="margin:4px 0 0">Vos codes restent uniquement sur ce téléphone.</p>
    <label for="lockPw">Mot de passe</label>
    <div class="row pwrow">
      <input id="lockPw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="big b-light eye" id="lockEye" aria-label="Voir le mot de passe">👁️</button>
    </div>
    <div id="lockErr" class="err hidden">❌ Mauvais mot de passe</div>
    <button class="big b-ok" id="btnUnlock">🔓 Ouvrir</button>
    <button class="big b-light oneline" id="btnHint">💡 J'ai oublié mon mot de passe</button>
    <div id="hintBox" class="help hidden"></div>
  </section>

  <!-- ÉCRAN CHOISIR LE MOT DE PASSE -->
  <section id="vSetPw" class="hidden compact">
    <label for="newPw">🔒 Mot de passe</label>
    <div class="row pwrow">
      <input id="newPw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="big b-light eye" id="newEye" aria-label="Voir le mot de passe">👁️</button>
    </div>
    <label for="newPw2">🔒 Encore le mot de passe</label>
    <input id="newPw2" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="newHint">💡 Phrase pour me souvenir</label>
    <input id="newHint" autocomplete="off" placeholder="Ex : année du permis">
    <button class="big b-ok" id="btnSavePw">✅ Enregistrer</button>
  </section>

  <!-- ÉCRAN 1 : LISTE -->
  <section id="vList">
    <div id="install" class="hidden" style="margin-bottom:12px">
      <button class="big b-ok" id="btnInstall" style="margin-top:0">📲 Installer sur mon téléphone</button>
      <div id="installIos" class="help hidden" style="margin-top:0">
        📲 <b>⬆️ Partager</b> puis <b>« Sur l'écran d'accueil »</b>
      </div>
      <div id="installOther" class="help hidden" style="margin-top:0">
        📲 <b>⋮</b> en haut puis <b>« Ajouter à l'écran d'accueil »</b>
      </div>
    </div>
    <div id="list" class="grid"></div>
    <div id="empty" class="empty hidden">
      <div class="ico">📭</div>
      <p>Pas encore de code.</p>
    </div>
    <button class="big b-main" id="btnAdd">➕ Ajouter un site</button>
    <button class="big b-light" id="btnProtect">🔒 Protéger mes codes</button>
  </section>

  <!-- ÉCRAN 2 : UN SITE -->
  <section id="vSite" class="hidden">
    <div id="siteTitle" class="title"></div>

    <div class="box">
      <div class="step"><span class="num">1</span> Identifiant</div>
      <div class="vrow">
        <div class="value" id="vUser"></div>
        <button class="big b-main copybtn" id="copyUser">Copier</button>
      </div>
    </div>

    <div class="box">
      <div class="step"><span class="num">2</span> Mot de passe</div>
      <div class="vrow">
        <div class="value" id="vPass"></div>
        <button class="big b-light eye" id="togglePass" aria-label="Voir le mot de passe">👁️</button>
        <button class="big b-main copybtn" id="copyPass">Copier</button>
      </div>
    </div>

    <div class="box">
      <div class="vrow">
        <span class="num">3</span>
        <button class="big b-ok" id="openSite" style="margin-top:0">🌐 Ouvrir le site</button>
      </div>
    </div>

    <div class="row smallrow">
      <button class="b-light smallbtn" id="btnEdit">✏️ Modifier</button>
      <button class="b-danger smallbtn" id="btnDelete">🗑️ Supprimer</button>
    </div>
  </section>

  <!-- ÉCRAN 3 : CHOISIR UN SITE -->
  <section id="vPick" class="hidden">
    <div id="presets" class="grid"></div>
  </section>

  <!-- ÉCRAN 4 : FORMULAIRE -->
  <section id="vForm" class="hidden">
    <div id="formTitle" class="title"></div>

    <div id="customFields" class="nofirstmargin">
      <label for="fName">Nom du site</label>
      <input id="fName" autocomplete="off" placeholder="Ex : Ma banque">
      <label for="fUrl">Adresse du site</label>
      <input id="fUrl" autocomplete="off" inputmode="url" placeholder="Ex : mabanque.fr">
    </div>

    <label for="fUser">Identifiant</label>
    <input id="fUser" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="fPass">Mot de passe</label>
    <input id="fPass" autocomplete="off" autocapitalize="off" spellcheck="false">

    <button class="big b-ok" id="btnSave">✅ Enregistrer</button>
  </section>

</main>

<div id="toast" class="toast hidden"></div>

<script>
// ---------- Sites proposés ----------
const PRESETS = [
  {id:"autre",  name:"Autre site",      ico:"➕", color:"#1e8a3c", url:""},
  {id:"ft",     name:"France Travail",  ico:"💼", color:"#1d3d8f", url:"https://candidat.francetravail.fr/espacepersonnel/"},
  {id:"ameli",  name:"Ameli",           ico:"🩺", color:"#0c6fb8", url:"https://assure.ameli.fr/"},
  {id:"caf",    name:"CAF",             ico:"🏠", color:"#0a7d8c", url:"https://www.caf.fr/"},
  {id:"impots", name:"Impôts",          ico:"🧾", color:"#34495e", url:"https://www.impots.gouv.fr/"},
  {id:"mcf",    name:"Mon Compte Formation", ico:"🎓", color:"#6a3d9a", url:"https://www.moncompteformation.gouv.fr/"},
  {id:"fc",     name:"France Connect",   ico:"🇫🇷", color:"#000091", url:"https://franceconnect.gouv.fr/"},
  {id:"ants",   name:"ANTS", ico:"🚗", color:"#b03a2e", url:"https://ants.gouv.fr/"},
  {id:"doctolib", name:"Doctolib",      ico:"📅", color:"#107aca", url:"https://www.doctolib.fr/"},
  {id:"gmail",  name:"Gmail",           ico:"✉️", color:"#c5221f", url:"https://mail.google.com/"},
  {id:"outlook",name:"Outlook", ico:"📧", color:"#0f6cbd", url:"https://outlook.live.com/"},
  {id:"retraite", name:"Info Retraite", ico:"👵", color:"#8e44ad", url:"https://www.info-retraite.fr/"}
];

// ---------- Données (restent sur le téléphone) ----------
// Sans mot de passe : codes dans KEY. Avec mot de passe : codes chiffrés (AES)
// dans KEY_SECURE ; sans le mot de passe, ils sont illisibles.
const KEY = "mescodes_v1";
const KEY_SECURE = "mescodes_secure_v1";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function loadPlain(){ try{ return JSON.parse(lsGet(KEY)) || []; }catch(e){ return []; } }
let secure = null; try{ secure = JSON.parse(lsGet(KEY_SECURE)); }catch(e){ secure = null; }
let cryptoKey = null;           // présent seulement quand l'application est déverrouillée
let items = secure ? [] : loadPlain();
let current = null;   // site affiché
let editing = null;   // {preset, item?}

// Chiffrement
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptWith(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {iv:b64(iv), data:b64(new Uint8Array(ct))};
}
async function decryptWith(key, s){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(s.iv)}, key, unb64(s.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function save(){
  let ok;
  if(secure){
    if(!cryptoKey) return;
    secure = Object.assign({}, secure, await encryptWith(cryptoKey, items));
    ok = lsSet(KEY_SECURE, JSON.stringify(secure));
    lsDel(KEY);
  } else {
    ok = lsSet(KEY, JSON.stringify(items));
  }
  if(!ok) toast("⚠️ Impossible d'enregistrer");
}

// ---------- Outils ----------
const $ = id => document.getElementById(id);
function show(v){
  ["vList","vSite","vPick","vForm","vLock","vSetPw"].forEach(x => $(x).classList.toggle("hidden", x!==v));
  $("hdrTitle").textContent = v==="vPick" ? "Nouveau code" : "Mes codes";
  $("hdrBack").classList.toggle("hidden", !["vSite","vPick","vForm","vSetPw"].includes(v));
  $("btnLockNow").classList.toggle("hidden", v!=="vList" || !(secure && cryptoKey));
  window.scrollTo(0,0);
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.remove("hidden");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add("hidden"),1800);
}
async function copy(text, btn, label){
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove();
  }
  if(ok){
    if(navigator.vibrate) navigator.vibrate(80);
    const old=btn.innerHTML; btn.innerHTML="✅ Copié !"; btn.style.background="var(--ok)";
    setTimeout(()=>{btn.innerHTML=old; btn.style.background="";},1600);
    toast("✅ "+label+" copié");
  } else toast("⚠️ Copie impossible");
}
function normUrl(u){
  u=(u||"").trim(); if(!u) return "";
  return /^https?:\/\//i.test(u) ? u : "https://"+u;
}
function tile(o, onClick){
  const b=document.createElement("button");
  b.className="site"; b.style.background=o.color;
  b.innerHTML=`<span class="ico">${o.ico}</span><span></span>`;
  b.lastChild.textContent=o.name;
  b.onclick=onClick; return b;
}
function titleBlock(el,o){
  el.style.background=o.color;
  el.innerHTML=`<span class="ico">${o.ico}</span><h2></h2>`;
  el.querySelector("h2").textContent=o.name;
}

// ---------- Écran liste ----------
function renderList(){
  const L=$("list"); L.innerHTML="";
  items.forEach(it => L.appendChild(tile(it, ()=>openSite(it.uid))));
  $("empty").classList.toggle("hidden", items.length>0);
  $("btnProtect").classList.toggle("hidden", !!secure);
}

// ---------- Verrou ----------
function lock(){
  if(!secure) return;
  cryptoKey=null; items=[]; current=null;
  $("lockPw").value=""; $("lockPw").type="password";
  $("lockErr").classList.add("hidden"); $("hintBox").classList.add("hidden");
  $("btnLockNow").classList.add("hidden");
  $("list").innerHTML="";
  show("vLock");
}
async function unlock(){
  const pw=$("lockPw").value;
  if(!pw){ $("lockPw").focus(); return; }
  $("btnUnlock").textContent="⏳ Ouverture…";
  try{
    const key=await deriveKey(pw, unb64(secure.salt));
    items=await decryptWith(key, secure);
    cryptoKey=key;
    $("lockErr").classList.add("hidden");
    renderList(); show("vList");
  }catch(e){
    $("lockErr").classList.remove("hidden");
    if(navigator.vibrate) navigator.vibrate([80,60,80]);
  }
  $("btnUnlock").textContent="🔓 Ouvrir";
}
$("btnUnlock").onclick=unlock;
$("lockPw").addEventListener("keydown", e=>{ if(e.key==="Enter") unlock(); });
$("btnHint").onclick=()=>{
  const h=(secure && secure.hint) ? secure.hint : "";
  const box=$("hintBox");
  box.textContent = h ? h : "Pas de phrase enregistrée. Demandez de l'aide à votre formateur.";
  box.classList.remove("hidden");
};
function eyeToggle(btnId, inputIds){
  $(btnId).onclick=()=>{
    const showIt=$(inputIds[0]).type==="password";
    inputIds.forEach(id=>$(id).type = showIt ? "text" : "password");
    $(btnId).textContent = showIt ? "🙈" : "👁️";
  };
}
eyeToggle("lockEye", ["lockPw"]);
eyeToggle("newEye", ["newPw","newPw2"]);

// Verrouillage automatique : si l'application reste fermée plus de 3 minutes.
let hiddenAt=0;
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(secure && cryptoKey && Date.now()-hiddenAt > 3*60*1000){ lock(); }
});

// ---------- Choisir / changer / enlever le mot de passe ----------
function openSetPw(){
  $("newPw").value=""; $("newPw2").value="";
  $("newPw").type="password"; $("newPw2").type="password"; $("newEye").textContent="👁️";
  $("newHint").value = secure ? (secure.hint||"") : "";
  show("vSetPw");
}
$("btnProtect").onclick=openSetPw;
$("btnLockNow").onclick=openSetPw;
$("btnSavePw").onclick=async()=>{
  const pw=$("newPw").value, pw2=$("newPw2").value, hint=$("newHint").value.trim();
  if(pw.length<4){ toast("✏️ Au moins 4 caractères"); $("newPw").focus(); return; }
  if(pw!==pw2){ toast("❌ Les 2 mots de passe sont différents"); $("newPw2").focus(); return; }
  if(!hint){ toast("✏️ Écrivez une phrase pour vous souvenir"); $("newHint").focus(); return; }
  if(hint && hint.toLowerCase().includes(pw.toLowerCase())){ toast("⚠️ N'écrivez pas le mot de passe dans la phrase"); $("newHint").focus(); return; }
  $("btnSavePw").textContent="⏳ Enregistrement…";
  const salt=crypto.getRandomValues(new Uint8Array(16));
  cryptoKey=await deriveKey(pw, salt);
  secure={salt:b64(salt), hint};
  await save();
  $("btnSavePw").textContent="✅ Enregistrer";
  renderList(); show("vList"); toast("🔒 Codes protégés");
};

// ---------- Écran site ----------
let passVisible=false;
function openSite(uid){
  current=items.find(i=>i.uid===uid); if(!current) return;
  titleBlock($("siteTitle"), current);
  $("vUser").textContent=current.user || "—";
  passVisible=false; renderPass();
  $("openSite").classList.toggle("hidden", !current.url);
  show("vSite");
}
function renderPass(){
  $("vPass").textContent = current.pass ? (passVisible ? current.pass : "•".repeat(8)) : "—";
  $("togglePass").textContent = passVisible ? "🙈" : "👁️";
}
$("togglePass").onclick=()=>{ passVisible=!passVisible; renderPass(); };
$("copyUser").onclick=e=>copy(current.user||"", e.currentTarget, "Identifiant");
$("copyPass").onclick=e=>copy(current.pass||"", e.currentTarget, "Mot de passe");
$("openSite").onclick=()=>{ if(current.url) window.open(current.url,"_blank"); };
$("btnEdit").onclick=()=>openForm(PRESETS.find(p=>p.id===current.preset)||PRESETS.find(p=>p.id==="autre"), current);
$("btnDelete").onclick=()=>{
  if(confirm("Supprimer "+current.name+" ?")){
    items=items.filter(i=>i.uid!==current.uid); save(); renderList(); show("vList");
  }
};

// ---------- Choisir un site ----------
function renderPresets(){
  const P=$("presets"); P.innerHTML="";
  PRESETS.forEach(p => P.appendChild(tile(p, ()=>openForm(p,null))));
}
$("btnAdd").onclick=()=>{ renderPresets(); show("vPick"); };
$("hdrBack").onclick=()=>{ renderList(); show("vList"); };

// ---------- Formulaire ----------
function openForm(preset, item){
  editing={preset,item};
  const custom = preset.id==="autre";
  titleBlock($("formTitle"), item || preset);
  $("customFields").classList.toggle("hidden", !custom);
  $("formTitle").classList.toggle("hidden", custom && !item);
  $("fName").value = item ? item.name : "";
  $("fUrl").value  = item ? (item.url||"") : "";
  $("fUser").value = item ? (item.user||"") : "";
  $("fPass").value = item ? (item.pass||"") : "";
  show("vForm");
}
$("btnSave").onclick=()=>{
  const {preset,item}=editing;
  const custom = preset.id==="autre";
  const name = custom ? $("fName").value.trim() : preset.name;
  if(!name){ toast("✏️ Écrivez le nom du site"); $("fName").focus(); return; }
  const data = {
    preset: preset.id, name,
    ico: custom ? "🌐" : preset.ico, color: preset.color,
    url: custom ? normUrl($("fUrl").value) : preset.url,
    user: $("fUser").value.trim(),
    pass: $("fPass").value
  };
  if(item){ Object.assign(item,data); }
  else { data.uid=Date.now().toString(36)+Math.random().toString(36).slice(2,6); items.push(data); }
  save(); renderList(); toast("✅ Enregistré");
  openSite(item ? item.uid : data.uid);
};


// ---------- Installation sur l'écran d'accueil ----------
(function(){
  const installed = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(installed) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const box=$("install"); box.classList.remove("hidden");
  $("btnInstall").classList.add("hidden");
  if(ios){ $("installIos").classList.remove("hidden"); return; }
  $("installOther").classList.remove("hidden");
  let prompt=null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); prompt=e;
    $("installOther").classList.add("hidden");
    $("btnInstall").classList.remove("hidden");
  });
  $("btnInstall").onclick=async()=>{
    if(!prompt) return;
    prompt.prompt();
    const r=await prompt.userChoice; prompt=null;
    if(r.outcome==="accepted") box.classList.add("hidden");
    else { $("btnInstall").classList.add("hidden"); $("installOther").classList.remove("hidden"); }
  };
  window.addEventListener("appinstalled", ()=>box.classList.add("hidden"));
})();

// ---------- Démarrage ----------
if(secure) lock(); else renderList();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
